syntax = "proto3";
package auth;

option go_package = "github.com/Weit145/proto-startup/auth;auth";

message Health {
    bool health = 1;
}

message Empty{}

message User {
  string id = 1;
  string email = 2;
  string username = 3;
  string role = 4;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}


message LoginRequest {
  string email = 1;
  string password = 2;
}


message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  User user = 3;
}

service Auth {
    rpc CheckHealth(Empty) returns (Health);
    rpc Register(RegisterRequest) returns (AuthResponse);
    rpc Login(LoginRequest) returns (AuthResponse);
}
